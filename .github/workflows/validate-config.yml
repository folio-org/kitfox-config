name: validate-config

# PR-time schema gate (Epic A, Story A.9). Validates every committed YAML under
# platform/ and clusters/ against its JSON Schema. No deploy — validation only.
on:
  pull_request:
    paths:
      - "platform/**"
      - "clusters/**"
      - "schemas/**"
      - "scripts/**"
      - "requirements.txt"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install -r requirements.txt
      - name: Validate all config YAML against schemas
        run: python scripts/validate_config.py
      - name: Schema smoke test (valid pass, broken fail)
        run: python scripts/smoke_test.py