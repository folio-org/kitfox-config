# §2.6 clusters/folio-etesting/namespaces/sprint/namespace.yaml
schemaVersion: 1

name: sprint

platform: EUREKA
configType: testing
platformBranch: snapshot
releaseType: SNAPSHOT

lifecycle:
  category: testing
  protected: true

members:
  - thunderjet
  - folijet
  - spitfire
  - Eureka

infra:
  pgType: aws
  kafkaType: aws
  s3Type: aws

features:
  rwSplit: false
  greenmail: false
  mockServer: false

configExtensions:
  - sunflower
  - consortia-single-ui

consortia:
  - central: consortium
    name: Consortium
    members: [university, college]

applications:
  exclude: []

tenants: [diku, university, college]
defaultTenant: diku

operations:
  uiBuild: true
  runSanityCheck: false
  skipReindex: false
  entitlementApproach: STATE
  setBaseUrl: true

podPlacement:
  nodeSelector: { "folio.org/qualitygate": cypress }
  tolerations:
    - { key: "folio.org/qualitygate", operator: Equal, value: cypress, effect: NoSchedule }

modules:
  mod-fqm-manager:
    extraEnvVars:
      - { name: mod-fqm-manager.entity-type-cache-timeout-seconds, value: "0" }
  mod-data-export:
    initContainer: { enabled: true }
    volumeClaims:  { extendedtmp: { enabled: true } }
