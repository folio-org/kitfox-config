# platform/defaults.yaml — repo-wide defaults, lowest-precedence layer (§2.1)
schemaVersion: 1

infra:
  pgType: built-in
  pgVersion: "16.8"
  kafkaType: built-in
  opensearchType: aws
  s3Type: built-in

features:
  rwSplit: false
  rtr: false
  ecsCCL: false
  scNative: true

# Build-wide Stripes UI tunables (global; was per-deployment-profile). Folded into
# each UI-having tenant's `ui` at resolve time. Moved here from the profiles since
# the values are uniform (release/perf variation was an artifact) (§2.1).
uiDefaults:
  idleSessionWarningSeconds: 60
  maxUnpagedResourceCount: 2000
  rtr:
    idleSessionTTL: 1h
    idleModalTTL: 30s

tenantDefaults:
  type: standard
  secure: false
  install:
    loadReference: true
    loadSample: true
    ignoreErrors: true
    async: true
    reinstall: false
    simulate: false
    purgeOnRollback: false
  config:
    kb:
      url: https://sandbox.ebsco.io
      customerId: apidvcorp
    worldcat:
      profileId: f26df83c-aa25-40b6-876e-96852c3d4fd4