# platform/edge-modules.yaml — edge service account + per-module capabilities (§2.4c)
# The only real edge config. Credential-free: institutionalUsers require passwordRef (NFR1).
schemaVersion: 1

edgeAdmin:
  username: edge_admin

modules:
  edge-orders:
    capabilitySets: [gobi.manage, ebsconet.manage, mosaic.manage, finance.manage]
    permissions:    [gobi.all, ebsconet.all]
  edge-patron:
    capabilitySets: [patron.manage]
    capabilities:   [users_collection.view, circulation_requests_item.view]
    permissions:    [patron.all, users.collection.get, circulation.requests.item.get]
  edge-oai-pmh:
    capabilitySets: [oai-pmh.manage]
    permissions:    [oai-pmh.all, user-tenants.collection.get]
    institutionalUsers:
      - { tenant: testoaipmh, username: test-user, passwordRef: secretsmanager://folio/edge/oai-pmh/test-user }
