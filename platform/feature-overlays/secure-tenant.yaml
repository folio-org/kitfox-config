# platform/feature-overlays/secure-tenant.yaml — presence-driven (§2.2b)
# Auto-selected when ANY tenant has `secure: true`. ${secureTenantId} is a
# pipeline value-substitution placeholder resolved from that tenant's id.
schemaVersion: 1
name: secure-tenant

modules:
  mod-circulation-bff:
    extraEnvVars:
      - { name: SECURE_TENANT_ID, value: "${secureTenantId}" }
  mod-requests-mediated:
    extraEnvVars:
      - { name: SECURE_TENANT_ID, value: "${secureTenantId}" }
  mod-patron:
    extraEnvVars:
      - { name: SECURE_TENANT_ID, value: "${secureTenantId}" }
  edge-patron:
    extraEnvVars:
      - { name: SECURE_TENANT_ID, value: "${secureTenantId}" }
      - { name: SECURE_REQUESTS_FEATURE_ENABLED, value: "true" }