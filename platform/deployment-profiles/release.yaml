# platform/deployment-profiles/release.yaml — compute base selected by configType (§2.2)
schemaVersion: 1
configType: release

defaults:
  replicaCount: 2
  resources:
    requests: { memory: 768Mi }
    limits:   { memory: 1536Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

moduleClassOverrides:
  mgr:
    resources:
      limits: { memory: 3Gi }

ui:
  idleSessionWarningSeconds: 60
  maxUnpagedResourceCount: 2000
  rtr:
    idleSessionTTL: "8h"
    idleModalTTL: "1m"